openapi: 3.0.3
info:
  title: ASDC Attendance Management API
  version: 1.0.0
  description: >-
    QR attendance with Google OAuth. Error codes: QR_INVALID, QR_EXPIRED, SESSION_CLOSED, SESSION_NOT_OPEN,
    BATCH_MISMATCH, ENROLLMENT_INELIGIBLE, ALREADY_CHECKED_IN, ACCOUNT_NOT_REGISTERED, VALIDATION_ERROR ...
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Envelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data: {}
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error:
          type: object
          properties:
            code:
              type: string
            details: {}
  responses:
    Error400:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: Validation error
            error:
              code: ERROR_CODE
              details: null
    Error401:
      description: Unauthenticated / expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: Unauthenticated / expired token
            error:
              code: ERROR_CODE
              details: null
    Error403:
      description: Forbidden (role or batch scope)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: Forbidden (role or batch scope)
            error:
              code: ERROR_CODE
              details: null
    Error404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: Not found
            error:
              code: ERROR_CODE
              details: null
    Error409:
      description: Conflict (duplicate, state, already checked in)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: Conflict (duplicate, state, already checked in)
            error:
              code: ERROR_CODE
              details: null
    Error429:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: Rate limited
            error:
              code: ERROR_CODE
              details: null
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new student account with a chosen course
      description: Public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              name: Jane Student
              email: student@example.com
              password: StrongPassword9!
              courseId: '{{id}}'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
  /auth/register-google:
    post:
      tags:
        - Auth
      summary: Complete Google registration for a new student
      description: Public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              idToken: <google credential>
              courseId: '{{id}}'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
