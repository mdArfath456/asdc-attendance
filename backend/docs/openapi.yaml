          application/json:
            schema:
              type: object
            example:
              email: student@example.com
              password: StrongPassword9!
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
  /auth/google:
    post:
      tags:
        - Auth
      summary: Google sign-in for existing students or admins; unknown users start registration
